name: Sync Upstream & Auto Build

on:
  schedule:
    # 错峰在每 2 小时的 23 分与每 3 小时的 53 分巡检，避开 GitHub 整点(0分)队列拥堵丢包
    - cron: '23 */2 * * *'
    - cron: '53 */3 * * *'
  workflow_dispatch: # 支持在 GitHub 网页手动点击一键检查同步

permissions:
  contents: write
  actions: write

jobs:
  check-and-sync:
    name: Check and Sync Upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check latest upstream release
        id: check_upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_TAG=$(gh api repos/cfal/shoes/releases/latest --jq .tag_name 2>/dev/null || echo "")
          if [ -z "$UPSTREAM_TAG" ]; then
            UPSTREAM_TAG=$(gh api repos/cfal/shoes/tags --jq '.[0].name' 2>/dev/null || echo "")
          fi
          echo "Upstream latest release tag: $UPSTREAM_TAG"
          echo "upstream_tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT

          OUR_RELEASE=$(gh api repos/${{ github.repository }}/releases/tags/$UPSTREAM_TAG --jq .tag_name 2>/dev/null || echo "")
          echo "Our current release for $UPSTREAM_TAG: $OUR_RELEASE"

          if [ -n "$UPSTREAM_TAG" ] && [ "$OUR_RELEASE" != "$UPSTREAM_TAG" ]; then
            echo "needs_sync=true" >> $GITHUB_OUTPUT
          else
            echo "needs_sync=false" >> $GITHUB_OUTPUT
          fi

      - name: Sync upstream code and trigger build
        if: steps.check_upstream.outputs.needs_sync == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_TAG="${{ steps.check_upstream.outputs.upstream_tag }}"
          echo "Starting synchronization for new version: $TARGET_TAG"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Backup entire .github/workflows directory so GITHUB_TOKEN never modifies workflow files
          cp -R .github/workflows "$RUNNER_TEMP/workflows"

          git remote add upstream https://github.com/cfal/shoes.git || true
          git fetch upstream "refs/tags/$TARGET_TAG:refs/tags/upstream-$TARGET_TAG" --force

          # Overlay exact upstream release files onto current master without importing upstream workflow commits
          git checkout master
          git rm -rf .
          git checkout "refs/tags/upstream-$TARGET_TAG" -- .

          # Restore exact .github/workflows directory from origin/master (zero workflow file diff)
          rm -rf .github/workflows
          cp -R "$RUNNER_TEMP/workflows" .github/workflows

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync upstream $TARGET_TAG"
          fi

          # Create/update release tag on this synced commit and push
          git tag -f "$TARGET_TAG"
          git push origin master
          git push -f origin "$TARGET_TAG"

          echo "Triggering Build Binaries workflow for $TARGET_TAG..."
          gh workflow run "Build Binaries" --repo "${{ github.repository }}" --ref master
          echo "Successfully triggered build workflow!"
