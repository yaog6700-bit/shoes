name: Build Binaries

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1
  CROSS_VERSION: 0.2.5

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            binary_name: shoes.exe
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            use_cross: false
            binary_name: shoes
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            use_cross: true
            binary_name: shoes
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            use_cross: true
            binary_name: shoes
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
            use_cross: true
            binary_name: shoes
          - target: x86_64-apple-darwin
            os: macos-15-intel
            use_cross: false
            binary_name: shoes
          - target: aarch64-apple-darwin
            os: macos-15
            use_cross: false
            binary_name: shoes
    env:
      TARGET: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}

      - name: Install pinned cross binary
        if: matrix.use_cross
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/cross-rs/cross/releases/download/v${CROSS_VERSION}/cross-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$RUNNER_TEMP/cross.tar.gz"
          echo "642375d1bcf3bd88272c32ba90e999f3d983050adf45e66bd2d3887e8e838bad  $RUNNER_TEMP/cross.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/cross.tar.gz" -C "$HOME/.cargo/bin" cross

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Build binary (cross)
        if: matrix.use_cross
        run: cross build --release --locked --target "$TARGET" --bin shoes

      - name: Build binary (native)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --locked --target "$TARGET" --bin shoes

      - name: Package binary and notices
        run: |
          mkdir -p package artifacts
          cp "target/$TARGET/release/${{ matrix.binary_name }}" package/
          if [ -f THIRD_PARTY_NOTICES.md ]; then cp THIRD_PARTY_NOTICES.md package/; fi
          if [ -d licenses ]; then cp -R licenses package/; fi
          if [[ "$TARGET" == *"windows"* ]]; then
            cd package
            7z a "../artifacts/shoes-$TARGET.zip" "${{ matrix.binary_name }}" $([ -f THIRD_PARTY_NOTICES.md ] && echo THIRD_PARTY_NOTICES.md) $([ -d licenses ] && echo licenses)
          else
            tar -czf "artifacts/shoes-$TARGET.tar.gz" -C package .
          fi

      - name: Upload verified archive
        uses: actions/upload-artifact@v4
        with:
          name: shoes-${{ matrix.target }}
          path: |
            artifacts/shoes-*.tar.gz
            artifacts/shoes-*.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified archives
        uses: actions/download-artifact@v4
        with:
          pattern: shoes-*
          path: release-artifacts
          merge-multiple: true

      - name: Checksum final archives
        run: |
          cd release-artifacts
          ls -la
          sha256sum * > SHA256SUMS

      - name: Determine tag name
        id: tag_name
        run: |
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            git fetch --tags --force || true
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.3.6")
            echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_name.outputs.tag }}
          files: |
            release-artifacts/*
          draft: false
          generate_release_notes: true